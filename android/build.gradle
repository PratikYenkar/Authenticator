buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        maven {
            url("${rootDir}/../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
    }
}

subprojects {
    afterEvaluate { project ->
        project.tasks.matching {
            it.name.startsWith('extract') && it.name.endsWith('Annotations')
        }.configureEach { task ->
            task.actions.clear()
            task.doLast {
                task.outputs.files.each { outFile ->
                    outFile.parentFile?.mkdirs()
                    if (!outFile.exists()) outFile.text = ''
                }
            }
        }

        if (project.hasProperty('android')) {
            project.android {
                if (!compileSdkVersion) compileSdkVersion rootProject.ext.compileSdkVersion
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
